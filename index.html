<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Progress Pengerjaan Rumah</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #0875e1;
            --primary-dark: #064fa6;
            --primary-soft: #f5f9ff;

            --text: #17283f;
            --muted: #7e8da3;

            --border: #deebf8;

            --success: #148756;
            --success-bg: #eaf9f1;

            --danger: #cb4a4a;
            --danger-bg: #fff0f0;

            --warning: #936c19;
            --warning-bg: #fff8e7;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100dvh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 18px;

            font-family: "Inter", Arial, sans-serif;

            color: var(--text);

            background:
                radial-gradient(
                    circle at 8% 8%,
                    rgba(63, 144, 239, 0.16),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 92% 90%,
                    rgba(7, 103, 211, 0.10),
                    transparent 32%
                ),
                #f4f8fd;

            overflow: hidden;
        }


        /* =========================================
           CARD
        ========================================= */

        .construction-counter {
            width: 100%;
            max-width: 620px;

            border-radius: 24px;

            overflow: hidden;

            background: #ffffff;

            border: 1px solid rgba(217, 229, 244, 0.95);

            box-shadow:
                0 25px 65px rgba(19, 77, 141, 0.12),
                0 6px 18px rgba(19, 77, 141, 0.04);
        }


        /* =========================================
           HEADER
        ========================================= */

        .counter-header {
            position: relative;

            height: 245px;

            padding: 30px 30px 70px;

            text-align: center;

            color: #ffffff;

            background:
                linear-gradient(
                    135deg,
                    #0879e8 0%,
                    #0866ca 45%,
                    #034b97 100%
                );

            overflow: hidden;
        }

        .counter-header::before {
            content: "";

            position: absolute;

            width: 260px;
            height: 260px;

            top: -165px;
            right: -100px;

            border-radius: 50%;

            background: rgba(255,255,255,.08);
        }

        .counter-header::after {
            content: "";

            position: absolute;

            width: 180px;
            height: 180px;

            left: -110px;
            bottom: -100px;

            border-radius: 50%;

            background: rgba(255,255,255,.06);
        }

        .header-content {
            position: relative;
            z-index: 2;
        }


        /* Icon rumah */

        .home-icon {
            width: 56px;
            height: 56px;

            margin: 0 auto 13px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 17px;

            font-size: 25px;

            background: rgba(255,255,255,.14);

            border: 1px solid rgba(255,255,255,.20);

            backdrop-filter: blur(8px);
        }


        .header-label {
            margin-bottom: 5px;

            font-size: 10px;
            font-weight: 700;

            letter-spacing: 2.6px;

            text-transform: uppercase;

            color: rgba(255,255,255,.72);
        }


        .counter-header h1 {
            margin-bottom: 7px;

            font-size: 27px;
            line-height: 1.2;

            font-weight: 800;

            letter-spacing: -0.8px;
        }


        .start-date {
            display: flex;
            align-items: center;
            justify-content: center;

            gap: 6px;

            font-size: 11px;
            font-weight: 500;

            color: rgba(255,255,255,.82);
        }

        .start-date i {
            font-size: 12px;
        }


        /* =========================================
           CONTENT
        ========================================= */

        .counter-content {
            position: relative;

            z-index: 5;

            margin-top: -55px;

            padding: 0 28px 23px;
        }


        /* =========================================
           MAIN COUNTER
        ========================================= */

        .main-counter {
            position: relative;

            max-width: 500px;

            margin: 0 auto 20px;

            padding: 20px 20px 18px;

            text-align: center;

            border-radius: 21px;

            background: #ffffff;

            border: 1px solid #e2ebf6;

            box-shadow:
                0 15px 35px rgba(22, 75, 132, 0.09);
        }


        .main-counter::before {
            content: "";

            position: absolute;

            top: 0;
            left: 50%;

            width: 58px;
            height: 4px;

            transform: translateX(-50%);

            border-radius: 0 0 8px 8px;

            background:
                linear-gradient(
                    90deg,
                    #69baff,
                    #1682eb
                );
        }


        .workday-number {
            margin-bottom: 5px;

            font-size: 72px;
            line-height: 1;

            font-weight: 800;

            letter-spacing: -5px;

            background:
                linear-gradient(
                    135deg,
                    #1181ee,
                    #0451a4
                );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

            background-clip: text;
        }


        .workday-title {
            display: flex;
            justify-content: center;
            align-items: center;

            gap: 7px;

            font-size: 15px;
            font-weight: 700;

            color: #253a57;
        }

        .workday-title i {
            font-size: 14px;

            color: var(--primary);
        }


        /* =========================================
           DURASI
        ========================================= */

        .duration {
            margin-top: 6px;

            display: flex;
            justify-content: center;
            align-items: center;

            flex-wrap: wrap;

            gap: 4px;

            font-size: 10px;
            font-weight: 500;

            color: var(--muted);
        }

        .duration strong {
            color: var(--primary);

            font-weight: 700;
        }

        .duration-prefix {
            color: #9ba8b8;
        }

        .duration-dot {
            margin: 0 3px;

            font-size: 5px;

            color: #a5bad2;
        }


        /* =========================================
           STATISTICS
        ========================================= */

        .statistics {
            display: grid;

            grid-template-columns: repeat(3, 1fr);

            gap: 10px;
        }

        .stat-card {
            padding: 15px 8px;

            text-align: center;

            border-radius: 16px;

            background:
                linear-gradient(
                    180deg,
                    #f8fbff,
                    #f2f7fd
                );

            border: 1px solid var(--border);

            transition:
                transform .2s ease,
                box-shadow .2s ease;
        }

        .stat-card:hover {
            transform: translateY(-2px);

            box-shadow:
                0 8px 20px rgba(18, 79, 145, 0.07);
        }


        .stat-icon {
            width: 34px;
            height: 34px;

            margin: 0 auto 8px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 10px;

            background: #e3f1ff;

            color: #0875dc;
        }

        .stat-icon i {
            font-size: 15px;
        }


        .stat-number {
            display: block;

            margin-bottom: 3px;

            font-size: 21px;
            line-height: 1.1;

            font-weight: 800;

            color: #075aac;
        }


        .stat-label {
            display: block;

            font-size: 9px;
            line-height: 1.35;

            font-weight: 500;

            color: #7c8ca2;
        }


        /* =========================================
           FOOTER
        ========================================= */

        .counter-footer {
            margin-top: 17px;

            padding-top: 14px;

            text-align: center;

            border-top: 1px solid #e9f0f7;
        }


        .today {
            margin-bottom: 8px;

            display: flex;
            justify-content: center;
            align-items: center;

            gap: 5px;

            font-size: 10px;
            font-weight: 500;

            color: #8190a4;
        }

        .today i {
            color: var(--primary);

            font-size: 11px;
        }

        .today strong {
            color: #4b6079;

            font-weight: 700;
        }


        /* =========================================
           STATUS
        ========================================= */

        .status {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            gap: 5px;

            padding: 6px 11px;

            border-radius: 100px;

            font-size: 9px;
            font-weight: 700;
        }

        .status i {
            font-size: 10px;
        }


        .status-working {
            color: var(--success);

            background: var(--success-bg);

            border: 1px solid #d3efdf;
        }


        .status-holiday {
            color: var(--danger);

            background: var(--danger-bg);

            border: 1px solid #f4dcdc;
        }


        .status-waiting {
            color: var(--warning);

            background: var(--warning-bg);

            border: 1px solid #f2e5ba;
        }


        /* =========================================
           NOTE
        ========================================= */

        .note {
            max-width: 430px;

            margin: 10px auto 0;

            display: flex;
            justify-content: center;
            align-items: flex-start;

            gap: 5px;

            font-size: 8px;
            line-height: 1.45;

            color: #a0acbc;
        }

        .note i {
            margin-top: 1px;

            font-size: 9px;

            color: #8ba9cb;
        }


        /* =========================================
           DESKTOP PENDEK
           contoh 1366 x 768
        ========================================= */

        @media (min-width: 651px) and (max-height: 760px) {

            body {
                padding: 10px;
            }

            .construction-counter {
                max-width: 580px;
            }

            .counter-header {
                height: 215px;

                padding-top: 20px;
            }

            .home-icon {
                width: 48px;
                height: 48px;

                margin-bottom: 9px;

                font-size: 21px;

                border-radius: 14px;
            }

            .header-label {
                font-size: 9px;
            }

            .counter-header h1 {
                font-size: 24px;
            }

            .counter-content {
                margin-top: -48px;

                padding-bottom: 16px;
            }

            .main-counter {
                padding:
                    15px
                    18px
                    14px;

                margin-bottom: 14px;
            }

            .workday-number {
                font-size: 62px;
            }

            .workday-title {
                font-size: 13px;
            }

            .stat-card {
                padding: 11px 7px;
            }

            .stat-icon {
                width: 29px;
                height: 29px;

                margin-bottom: 5px;
            }

            .stat-icon i {
                font-size: 13px;
            }

            .stat-number {
                font-size: 18px;
            }

            .counter-footer {
                margin-top: 12px;
                padding-top: 10px;
            }

            .note {
                margin-top: 7px;
            }
        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 650px) {

            body {
                display: block;

                padding: 15px 12px;

                overflow-y: auto;
            }

            .construction-counter {
                max-width: 100%;

                margin: 0 auto;

                border-radius: 22px;
            }

            .counter-header {
                height: 235px;

                padding:
                    28px
                    18px
                    65px;
            }

            .home-icon {
                width: 52px;
                height: 52px;

                border-radius: 15px;

                font-size: 23px;
            }

            .header-label {
                font-size: 9px;
            }

            .counter-header h1 {
                font-size: 24px;
            }

            .counter-content {
                margin-top: -52px;

                padding:
                    0
                    14px
                    20px;
            }

            .main-counter {
                padding:
                    20px
                    12px
                    17px;

                margin-bottom: 15px;
            }

            .workday-number {
                font-size: 65px;
            }

            .statistics {
                gap: 7px;
            }

            .stat-card {
                padding:
                    14px
                    4px;
            }

            .stat-number {
                font-size: 19px;
            }

            .stat-label {
                font-size: 8px;
            }

            .note {
                padding: 0 8px;
            }
        }


        /* =========================================
           MOBILE KECIL
        ========================================= */

        @media (max-width: 380px) {

            .statistics {
                grid-template-columns: 1fr;
            }

            .stat-card {
                display: grid;

                grid-template-columns:
                    35px
                    auto;

                grid-template-rows:
                    auto
                    auto;

                align-items: center;

                column-gap: 10px;

                text-align: left;

                padding: 11px 14px;
            }

            .stat-icon {
                grid-row: 1 / 3;

                margin: 0;
            }

            .stat-number {
                margin: 0;
            }
        }

    </style>
</head>


<body>

<main class="construction-counter">


    <!-- HEADER -->
    <header class="counter-header">

        <div class="header-content">

            <div class="home-icon">
                <i class="bi bi-house-door-fill"></i>
            </div>

            <div class="header-label">
                Progress Pembangunan
            </div>

            <h1>
                Pengerjaan Rumah
            </h1>

            <div class="start-date">

                <i class="bi bi-calendar-check"></i>

                <span>
                    Dimulai Senin, 13 April 2026
                </span>

            </div>

        </div>

    </header>



    <!-- CONTENT -->
    <section class="counter-content">


        <!-- COUNTER UTAMA -->
        <div class="main-counter">

            <div
                class="workday-number"
                id="workDay"
            >
                0
            </div>


            <div class="workday-title">

                <i class="bi bi-hammer"></i>

                <span>
                    Hari Pengerjaan
                </span>

            </div>


            <div
                class="duration"
                id="workDuration"
            >
                <span class="duration-prefix">
                    ≈
                </span>

                <strong>0</strong> bulan

                <span class="duration-dot">
                    <i class="bi bi-circle-fill"></i>
                </span>

                <strong>0</strong> minggu

                <span class="duration-dot">
                    <i class="bi bi-circle-fill"></i>
                </span>

                <strong>0</strong> hari
            </div>

        </div>



        <!-- STATISTIK -->
        <div class="statistics">


            <div class="stat-card">

                <div class="stat-icon">
                    <i class="bi bi-calendar3"></i>
                </div>

                <span
                    class="stat-number"
                    id="calendarDays"
                >
                    0
                </span>

                <span class="stat-label">
                    Hari Kalender
                </span>

            </div>



            <div class="stat-card">

                <div class="stat-icon">
                    <i class="bi bi-calendar-x"></i>
                </div>

                <span
                    class="stat-number"
                    id="sundayCount"
                >
                    0
                </span>

                <span class="stat-label">
                    Minggu / Libur
                </span>

            </div>



            <div class="stat-card">

                <div class="stat-icon">
                    <i class="bi bi-calendar-week"></i>
                </div>

                <span
                    class="stat-number"
                    id="weekCount"
                >
                    0
                </span>

                <span class="stat-label">
                    Minggu Berjalan
                </span>

            </div>

        </div>



        <!-- FOOTER -->
        <div class="counter-footer">


            <div
                class="today"
                id="today"
            ></div>


            <div id="status"></div>


            <div class="note">

                <i class="bi bi-info-circle"></i>

                <span>
                    Hari pengerjaan dihitung Senin–Sabtu.
                    Minggu merupakan hari libur.
                </span>

            </div>

        </div>

    </section>

</main>



<script>

    /* =========================================
       TANGGAL MULAI
       Senin, 13 April 2026
    ========================================= */

    const startDate =
        new Date(2026, 3, 13);


    const today =
        new Date();


    startDate.setHours(
        0,
        0,
        0,
        0
    );


    today.setHours(
        0,
        0,
        0,
        0
    );



    /* =========================================
       HITUNG HARI
    ========================================= */

    let workDays = 0;

    let calendarDays = 0;

    let sundayCount = 0;



    if (today >= startDate) {

        const currentDate =
            new Date(startDate);


        while (
            currentDate <= today
        ) {

            calendarDays++;


            /*
                0 = Minggu
                1 = Senin
                2 = Selasa
                3 = Rabu
                4 = Kamis
                5 = Jumat
                6 = Sabtu
            */

            if (
                currentDate.getDay() === 0
            ) {

                sundayCount++;

            } else {

                workDays++;

            }


            currentDate.setDate(
                currentDate.getDate() + 1
            );

        }

    }



    /* =========================================
       MINGGU BERJALAN
    ========================================= */

    const weekCount =
        calendarDays > 0
            ? Math.ceil(
                calendarDays / 7
            )
            : 0;



    /* =========================================
       KONVERSI HARI KERJA
    ========================================= */

    const WORK_DAYS_PER_MONTH = 26;

    const WORK_DAYS_PER_WEEK = 6;


    let remainingDays =
        workDays;



    const workMonths =
        Math.floor(
            remainingDays /
            WORK_DAYS_PER_MONTH
        );


    remainingDays =
        remainingDays %
        WORK_DAYS_PER_MONTH;



    const workWeeks =
        Math.floor(
            remainingDays /
            WORK_DAYS_PER_WEEK
        );



    const workRemainingDays =
        remainingDays %
        WORK_DAYS_PER_WEEK;



    /* =========================================
       UPDATE DATA
    ========================================= */

    document
        .getElementById("workDay")
        .textContent =
        workDays;


    document
        .getElementById("calendarDays")
        .textContent =
        calendarDays;


    document
        .getElementById("sundayCount")
        .textContent =
        sundayCount;


    document
        .getElementById("weekCount")
        .textContent =
        weekCount;



    /* =========================================
       DURASI
    ========================================= */

    document
        .getElementById("workDuration")
        .innerHTML = `

            <span class="duration-prefix">
                ≈
            </span>

            <strong>
                ${workMonths}
            </strong>
            bulan

            <span class="duration-dot">
                <i class="bi bi-circle-fill"></i>
            </span>

            <strong>
                ${workWeeks}
            </strong>
            minggu

            <span class="duration-dot">
                <i class="bi bi-circle-fill"></i>
            </span>

            <strong>
                ${workRemainingDays}
            </strong>
            hari

        `;



    /* =========================================
       FORMAT TANGGAL
    ========================================= */

    const dateFormatter =
        new Intl.DateTimeFormat(
            "id-ID",
            {
                weekday: "long",
                day: "numeric",
                month: "long",
                year: "numeric"
            }
        );


    const formattedToday =
        dateFormatter.format(today);



    /* =========================================
       HARI INI
    ========================================= */

    document
        .getElementById("today")
        .innerHTML = `

            <i class="bi bi-clock"></i>

            <span>
                Hari ini
                &nbsp;•&nbsp;

                <strong>
                    ${formattedToday}
                </strong>
            </span>

        `;



    /* =========================================
       STATUS
    ========================================= */

    const statusElement =
        document.getElementById(
            "status"
        );



    /* BELUM MULAI */

    if (
        today < startDate
    ) {

        statusElement.innerHTML = `

            <span
                class="
                    status
                    status-waiting
                "
            >

                <i class="bi bi-hourglass-split"></i>

                Pengerjaan Belum Dimulai

            </span>

        `;

    }


    /* MINGGU */

    else if (
        today.getDay() === 0
    ) {

        statusElement.innerHTML = `

            <span
                class="
                    status
                    status-holiday
                "
            >

                <i class="bi bi-calendar-x-fill"></i>

                Hari Libur • Minggu

            </span>

        `;

    }


    /* SENIN - SABTU */

    else {

        statusElement.innerHTML = `

            <span
                class="
                    status
                    status-working
                "
            >

                <i class="bi bi-check-circle-fill"></i>

                Hari Pengerjaan

            </span>

        `;

    }

</script>

</body>
</html>
